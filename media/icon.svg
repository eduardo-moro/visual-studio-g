<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36A9F7"/>
      <stop offset="1" stop-color="#0A4F9E"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD24A"/>
      <stop offset="1" stop-color="#F29A00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#062B57" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="116" rx="54" fill="url(#shine)"/>

  <!-- code lines, like an editor -->
  <g fill="#ffffff" fill-opacity="0.22">
    <rect x="34" y="40" width="54" height="10" rx="5"/>
    <rect x="96" y="40" width="30" height="10" rx="5"/>
    <rect x="46" y="58" width="40" height="10" rx="5"/>
  </g>

  <!-- the G -->
  <g filter="url(#shadow)">
    <path d="M 177 93 A 64 64 0 1 0 190 140 L 132 140"
          fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- run / step badge -->
  <g filter="url(#shadow)">
    <circle cx="190" cy="190" r="42" fill="url(#badge)" stroke="#0A4F9E" stroke-width="8"/>
    <path d="M 177 168 L 211 190 L 177 212 Z" fill="#0A4F9E" stroke="#0A4F9E" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
