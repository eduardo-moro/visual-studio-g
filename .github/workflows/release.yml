# Publishes a new version when a tag like v0.2.0 is pushed:
#   npm version minor && git push --follow-tags
# Always creates a GitHub release with the .vsix. Also publishes to the VS Code Marketplace
# and Open VSX when the repository secrets VSCE_PAT / OVSX_PAT exist (skipped otherwise).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vsce package --no-dependencies
      - name: VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --packagePath *.vsix
      - name: Open VSX (VSCodium, Cursor, ...)
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish *.vsix
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" *.vsix --title "Visual Studio G $GITHUB_REF_NAME" --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
